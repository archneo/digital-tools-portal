<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Tools Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Tools</h1>
  <p class="sub">Private launcher · Cloudflare Access protected</p>
</header>

<main>
  <section>
    <h2>Workspace</h2>
    <div class="grid">
      <a class="tile" href="https://mail.google.com/">Gmail</a>
      <a class="tile" href="https://calendar.google.com/">Calendar</a>
      <a class="tile" href="https://drive.google.com/">Drive</a>
      <a class="tile" href="https://www.notion.so/">Notion</a>
      <a class="tile" href="https://www.canva.com/">Canva</a>
    </div>
  </section>

  <section>
    <h2>Build</h2>
    <div class="grid">
      <a class="tile" href="https://github.com/archneo">GitHub</a>
      <a class="tile" href="https://archneolab.app.n8n.cloud/">n8n</a>
      <a class="tile" href="https://replit.com/">Replit</a>
    </div>
  </section>

  <section>
    <h2>AI</h2>
    <div class="grid">
      <a class="tile" href="https://manus.im/">Manus</a>
      <a class="tile" href="https://kimi.moonshot.cn/">Kimi</a>
    </div>
    <p class="note">Links go to login pages. No credentials are stored here.</p>
  </section>
</main>

<footer>
  <p>Private · Static · No tracking</p>
</footer>
</body>
</html>
